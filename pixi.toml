[workspace]
authors = ["Seungjin Yang <slowmoyang@gmail.com>"]
channels = ["conda-forge"]
name = "khu-tutorial-pythia8"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# inputs+outputs make this a no-op unless the build definition changed
configure = { cmd = "meson setup build", inputs = ["meson.build", "subprojects/*.wrap"], outputs = ["build/build.ninja"] }
reconfigure = "meson setup build --wipe"
build = { cmd = "meson compile -C build", depends-on = ["configure"] }
run = { cmd = "./build/run-pythia8", depends-on = ["build"] }

[dependencies]
pythia8 = ">=8.312,<9"
lhapdf = ">=6.5.6,<7"
c-compiler = ">=1.11.0,<2"
cxx-compiler = ">=1.11.0,<2"
hepmc3 = ">=3.3.1,<4"
pyhepmc = ">=2.16.1,<3"
meson = ">=1.11.2,<2"
